          'region/jeonnam/jangseong/index.html':('장성','주택·상가·사업장','읍·면 주거지와 사업장의 배관 길이와 외부 관로 연결을 고려해 실내 배수구 문제인지 외부 오수관 문제인지 확인하도록 안내합니다.','누수는 배관 재질과 계통을 확인하고 보수가 이뤄진 경우 결과를 2차 압력검사로 재확인하는 절차를 강조합니다.',['외부오수관','배수구막힘','수도배관','2차압력검사']),
          'region/jeonnam/yeonggwang/index.html':('영광','주택·상가·공동주택','주택과 공동주택에서 아래층 천장 물샘이 보이는 경우 피해 지점과 실제 누수 지점이 다를 수 있어 배관 계통 구분부터 안내합니다.','하수구는 변기·싱크대·배수구 중 어느 지점이 함께 반응하는지를 확인해 개별 배관과 메인 오수관 범위를 나눕니다.',['천장누수','PB배관','오수관','변기막힘']),
          'region/jeonnam/hampyeong/index.html':('함평','주택·상가·소규모 사업장','읍·면 지역 건물의 실내 배관과 외부 배수관 연결을 구분해 물이 느린 지점과 맨홀 수위 변화를 함께 확인하도록 안내합니다.','누수 상담에서는 계량기·압력 변화와 피해 흔적을 먼저 정리해 불필요한 개방 범위를 줄이는 진단 순서를 설명합니다.',['외부배수관','맨홀','계량기누수','압력검사']),
