          'region/jeonnam/boseong/index.html':('보성','주택·상가·사업장','주택·상가와 작업시설의 배수 특성을 구분해 싱크대 슬러지, 바닥배수구 역류, 외부 오수관 문제를 각각 확인합니다.','배수가 잠시 좋아졌다 다시 느려지는 경우 단순 통수 여부보다 내시경으로 잔여 이물과 배관 내부 상태를 확인하는 기준을 안내합니다.',['싱크대슬러지','바닥배수구','오수관','내시경진단']),
          'region/jeonnam/gokseong/index.html':('곡성','주택·상가·숙박시설','읍·면 주택과 상가·숙박시설에서 배수 지점이 멀리 연결되는 경우를 고려해 실내 막힘과 외부 관로 문제를 분리해 확인합니다.','누수는 물이 보이는 위치보다 압력검사와 배관 계통 정보를 먼저 활용해 탐지 범위를 좁히는 설명에 초점을 둡니다.',['외부관로','숙박시설하수구','누수탐사','수도배관']),
