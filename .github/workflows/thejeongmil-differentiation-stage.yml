name: TheJeongmil 27 Region Differentiation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/thejeongmil-differentiation-stage.yml']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  differentiate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add truthful region-specific intent blocks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json
          D={
          'region/gwangju/gwangsan/index.html':('광산구','아파트·상가·산업시설','싱크대·배수구의 개별 막힘과 여러 배수구가 함께 느려지는 메인관로 증상을 구분해 확인합니다.','수완동·첨단·하남·평동 생활권은 주거와 상업·산업 시설이 섞여 있어 건물 용도와 배관 사용량을 먼저 확인하는 안내에 초점을 둡니다.',['싱크대막힘','오수관막힘','공장배수','누수탐지']),
          'region/gwangju/bukgu/index.html':('북구','아파트·주택·상가','용봉동·운암동·일곡동 등 주거 생활권에서 자주 문의하는 변기·싱크대·바닥배수구 증상을 각각 나눠 살핍니다.','한 곳의 막힘인지 공용 또는 메인 배관 영향인지 사용 지점과 역류 위치를 기준으로 범위를 좁히는 방식으로 안내합니다.',['변기막힘','싱크대막힘','배수구역류','천장누수']),
          'region/gwangju/seogu/index.html':('서구','아파트·상가·업무시설','상무지구·치평동·화정동 등 공동주택과 상업시설에서 발생하는 반복 배수 문제는 사용량과 공용배관 연결 여부를 함께 확인합니다.','누수는 젖은 위치만 보고 단정하지 않고 냉수·온수·난방 계통을 구분해 탐지 범위를 줄이는 과정을 설명합니다.',['횡주관막힘','상가하수구','누수탐지','난방배관']),
          'region/gwangju/namgu/index.html':('남구','주택·아파트·근린상가','봉선동·진월동·주월동 생활권은 주택과 공동주택의 배관 구조 차이를 고려해 증상 발생 지점부터 확인하도록 안내합니다.','변기와 바닥배수구가 동시에 반응하는지, 천장 물샘이 수도 사용과 연동되는지처럼 고객이 현장에서 확인할 수 있는 단서를 우선 정리합니다.',['주택하수구','변기역류','천장물샘','수도배관누수']),
          'region/gwangju/donggu/index.html':('동구','상가·주택·다중이용시설','충장로·금남로·학동 등 상업·주거 건물이 함께 있는 생활권 특성을 고려해 배관의 사용 지점과 건물 내 연결 구조를 먼저 확인합니다.','오래 반복된 막힘은 단순 통수 여부보다 내시경 확인과 관로 범위 판단을, 물샘은 피해 위치와 공급 배관 계통 구분을 우선합니다.',['상가배수구','관로탐지','배관내시경','누수탐사']),
          'region/jeonnam/mokpo/index.html':('목포','아파트·상가·주택','도심 주거지와 상가에서 싱크대·변기·바닥배수구 중 어느 지점부터 증상이 시작됐는지 확인해 가지배관과 메인관로 문제를 구분합니다.','여러 배수구가 동시에 느려지거나 맨홀 쪽에서 수위 변화가 보이면 오수관 범위까지 확인해야 할 가능성을 설명합니다.',['하수구역류','오수관','맨홀역류','누수탐지']),
          'region/jeonnam/yeosu/index.html':('여수','주거·상가·사업장','주거시설뿐 아니라 상가와 사업장 배관 문의를 고려해 사용량이 많은 배관의 슬러지·오수관·메인 배수 문제를 구분하는 안내를 강화합니다.','막힘은 관경과 배관 길이, 동시 역류 여부를 확인하고 누수는 압력검사 결과에 따라 탐지 장비 적용 순서를 정하는 흐름을 설명합니다.',['사업장배관','오수관막힘','고압세척','압력검사']),
          'region/jeonnam/suncheon/index.html':('순천','아파트·상가·공장','주거지와 상업·산업 시설의 배관 사용 조건이 다르므로 공장 메인 오수관, 상가 배수관, 아파트 공용배관을 같은 방식으로 단정하지 않습니다.','대형 또는 긴 관로는 내시경과 관로 확인을 바탕으로 고압세척 필요성을 판단하고 작업 후 배수 상태를 다시 확인하는 기준을 안내합니다.',['공장하수구','오수관역류','횡주관','고압세척']),
          'region/jeonnam/naju/index.html':('나주','아파트·상가·산업시설','빛가람동을 포함한 공동주택·상가와 산업시설의 배관 문제는 건물 용도와 배수 지점 수를 먼저 확인하도록 구성했습니다.','한 지점의 싱크대 막힘과 여러 시설이 연결된 메인 배관 문제를 분리하고, 누수는 압력 변화와 피해 위치를 함께 봅니다.',['빛가람동하수구','공장배관','싱크대막힘','누수탐지']),
          'region/jeonnam/gwangyang/index.html':('광양','아파트·상가·산업시설','주거시설과 산업시설의 배관 조건 차이를 고려해 대구경·장거리 관로와 일반 가정 배수 문제를 구분해서 안내합니다.','맨홀 수위 상승이나 여러 배수구 동시 역류는 메인 오수관 가능성을, 한 곳의 느린 배수는 해당 가지배관 상태를 먼저 확인합니다.',['산업시설배관','대형관로','맨홀역류','배관청소']),
