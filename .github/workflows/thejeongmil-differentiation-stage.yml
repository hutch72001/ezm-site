          'region/jeonnam/gangjin/index.html':('강진','주택·상가·사업장','읍·면 주택과 상가에서 실내 배수와 외부 오수관의 연결 상태를 나눠 보고 반복되는 역류의 범위를 확인하도록 안내합니다.','누수는 수도 사용 여부와 압력 변화를 함께 확인하고 보수가 필요한 경우 필요한 구간만 개방하는 진단 원칙을 설명합니다.',['주택하수구','외부오수관','수도누수','압력검사']),
          'region/jeonbuk/gochang/index.html':('고창','주택·상가·공동주택','주택·상가의 배수 문제와 공동주택 천장 물샘 문의를 분리해 하수구와 누수 진단 흐름을 각각 구체적으로 안내합니다.','누수는 압력·열화상·가스·청음 결과를 한 가지 신호만으로 단정하지 않고 교차 확인한 뒤 보수 범위를 판단하는 기준을 강조합니다.',['천장누수','가스탐지','청음탐지','오수관막힘']),
          'region/jeonbuk/jeongeup/index.html':('정읍','주택·상가·사업장','도심 주거지와 읍·면 사업장의 배관 조건을 나눠 싱크대·변기 같은 실내 지점과 외부 오수관 문제를 구분합니다.','여러 배수구 동시 역류는 메인관로 가능성을 먼저 살피고 누수는 냉수·온수·난방 계통을 압력검사로 나눠 확인합니다.',['메인오수관','변기역류','온수배관','난방배관']),
          'region/jeonbuk/namwon/index.html':('남원','아파트·주택·상가','공동주택과 단독주택·상가의 배관 연결 차이를 고려해 반복막힘이 개별 지점인지 공용·메인 배관인지 확인하는 과정을 안내합니다.','누수는 천장 물샘과 보일러 압력 저하처럼 증상 유형을 나눠 수도배관과 난방배관의 검사 순서를 다르게 설명합니다.',['아파트횡주관','반복막힘','보일러압력','난방누수']),
          'region/jeonbuk/sunchang/index.html':('순창','주택·상가·사업장','읍·면 주택과 상가의 실내 배수구에서 외부 오수관까지 이어지는 흐름을 기준으로 막힘 위치를 단계적으로 좁힙니다.','물이 전혀 내려가지 않는 완전 막힘과 천천히 내려가는 부분 막힘을 구분하고 재발 여부에 따라 내시경 확인 필요성을 판단합니다.',['부분막힘','주택오수관','배관내시경','누수탐지'])}
          marker='<!-- REGION-DIFFERENTIATION-V1 -->'
          changed=[]
          for path,(region,types,p1,p2,keys) in D.items():
            p=Path(path)
            if not p.exists(): raise SystemExit('missing '+path)
            s=p.read_text(encoding='utf-8')
            if marker in s: continue
            block=f'''{marker}<section class="v4-section v4-region-difference"><div class="v4-shell"><span class="v4-kicker">{region.upper()} DIAGNOSIS GUIDE</span><h2>{region}, 건물과 증상에 따라 확인 순서가 달라집니다</h2><p><strong>주요 상담 건물:</strong> {types}</p><p>{p1}</p><p>{p2}</p><div class="v4-herochips">{''.join(f'<span>{k}</span>' for k in keys)}</div><p class="v4-note">이 내용은 {region}의 특정 시공실적을 뜻하지 않으며, 상담 시 증상을 구분하기 위한 지역 서비스 안내입니다.</p></div></section>'''
            anchor='<nav class="v4-bottom">'
            if anchor not in s: raise SystemExit('anchor missing '+path)
            s=s.replace(anchor,block+anchor,1)
            p.write_text(s,encoding='utf-8'); changed.append(path)
          Path('REGION-DIFFERENTIATION-REPORT.json').write_text(json.dumps({'target':27,'changed':len(changed),'pages':changed},ensure_ascii=False,indent=2),encoding='utf-8')
          print('changed',len(changed))
          PY
      - name: Commit differentiated pages
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add region REGION-DIFFERENTIATION-REPORT.json
          git diff --cached --quiet || git commit -m 'Differentiate 27 regional service pages'
          git push
