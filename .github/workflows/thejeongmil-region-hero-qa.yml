name: TheJeongmil Regional Hero QA

on:
  push:
    branches: [main]
    paths:
      - 'region/gwangju/**'
      - 'region/jeonnam/**'
      - 'region/jeonbuk/**'
      - 'assets/thejeongmil-region-hero.css'
      - 'tools/thejeongmil_region_hero_qa.py'
      - '.github/workflows/thejeongmil-region-hero-qa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qa:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run region hero QA
        run: python tools/thejeongmil_region_hero_qa.py
      - name: Commit QA reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add REGION-HERO-QA.json REGION-HERO-QA.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record regional hero QA results"
          git push
