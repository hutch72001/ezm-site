name: TheJeongmil Stage2 Region Conversion

on:
  push:
    branches: [main]
    paths:
      - 'tools/thejeongmil_stage2_migrate.py'
      - '.github/workflows/thejeongmil-stage2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run regional conversion
        run: python tools/thejeongmil_stage2_migrate.py
      - name: Commit converted region pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add region/gwangju region/jeonnam region/jeonbuk/gochang region/jeonbuk/jeongeup region/jeonbuk/namwon region/jeonbuk/sunchang DEPLOY-VERSION.txt
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Convert service region pages to 더정밀누수하수구"
          git push
