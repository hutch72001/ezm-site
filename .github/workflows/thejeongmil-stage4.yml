name: TheJeongmil Stage4 Priority Regions
on:
  push:
    branches: [main]
    paths:
      - 'tools/thejeongmil_stage4_priority.py'
      - '.github/workflows/thejeongmil-stage4.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  enrich:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: python tools/thejeongmil_stage4_priority.py
      - name: Commit priority pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add region/jeonbuk/gochang region/jeonbuk/jeongeup region/jeonbuk/namwon region/jeonbuk/sunchang region/jeonnam/naju region/jeonnam/damyang region/jeonnam/jangseong region/jeonnam/hwasun DEPLOY-VERSION.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Differentiate priority regional landing pages"
          git push
