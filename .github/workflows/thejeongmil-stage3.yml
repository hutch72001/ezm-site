name: TheJeongmil Stage3 Landing Enrichment

on:
  push:
    branches: [main]
    paths:
      - 'tools/thejeongmil_stage3_enrich.py'
      - '.github/workflows/thejeongmil-stage3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Enrich regional landing pages
        run: python tools/thejeongmil_stage3_enrich.py
      - name: Commit enriched pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add region/gwangju region/jeonnam region/jeonbuk/gochang region/jeonbuk/jeongeup region/jeonbuk/namwon region/jeonbuk/sunchang DEPLOY-VERSION.txt
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Enrich 더정밀 regional landing pages with diagnostic search content"
          git push
